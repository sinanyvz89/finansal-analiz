<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Mizan dosyanizdan otomatik gelir tablosu, bilanco, nakit akis, oran analizi ve vergi hesaplari." />
  <meta name="theme-color" content="#F8F9FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1A18" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FinAnaliz" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>Finansal Analiz</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#1a1a1a;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;min-height:100vh;min-height:100dvh}
    :root{--color-background-primary:#fff;--color-background-secondary:#f5f5f4;--color-background-tertiary:#eeeeec;--color-background-info:#E6F1FB;--color-background-danger:#FCEBEB;--color-background-success:#E1F5EE;--color-background-warning:#FAEEDA;--color-text-primary:#1a1a1a;--color-text-secondary:#666660;--color-text-tertiary:#99998f;--color-text-info:#185FA5;--color-text-danger:#A32D2D;--color-text-success:#0F6E56;--color-text-warning:#BA7517;--color-border-primary:rgba(0,0,0,0.4);--color-border-secondary:rgba(0,0,0,0.3);--color-border-tertiary:rgba(0,0,0,0.15);--color-border-info:#85B7EB;--color-border-danger:#F09595;--color-border-success:#9FE1CB;--color-border-warning:#FAC775;--border-radius-md:8px;--border-radius-lg:12px;--font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--fa-bar-bg:rgba(248,249,250,0.86)}
    @media(prefers-color-scheme:dark){:root{--color-background-primary:#1e1e1e;--color-background-secondary:#2a2a28;--color-background-tertiary:#333330;--color-background-info:#0C447C;--color-background-danger:#501313;--color-background-success:#04342C;--color-background-warning:#412402;--color-text-primary:#f0f0ee;--color-text-secondary:#a0a098;--color-text-tertiary:#777770;--color-text-info:#85B7EB;--color-text-danger:#F09595;--color-text-success:#5DCAA5;--color-text-warning:#FAC775;--color-border-primary:rgba(255,255,255,0.4);--color-border-secondary:rgba(255,255,255,0.3);--color-border-tertiary:rgba(255,255,255,0.15);--fa-bar-bg:rgba(26,26,24,0.86)}body{background:#1a1a18;color:#f0f0ee}}
    .fa-shell{max-width:960px;margin:0 auto;padding:24px 16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
    .fa-header{margin-bottom:24px}
    @media(max-width:760px){.fa-shell{padding-top:0;padding-bottom:0}.fa-header{display:none}}
  </style>
  <script>
    // Android/Chrome kurulum istemini yakala (React yuklenmeden once gelebilir)
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__faInstall = e;
      window.dispatchEvent(new Event('fa-installable'));
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          // Uygulama on plana geldiginde yeni surum var mi kontrol et
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
